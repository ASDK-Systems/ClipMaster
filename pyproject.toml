[project]
name = "ytautomation"
version = "0.1.0"
description = "AI-powered viral clip extraction & publishing pipeline for YouTube videos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Video download
    "yt-dlp>=2024.12.0",

    # Speech-to-Text & AI
    "openai>=1.40.0",

    # Video processing
    "ffmpeg-python>=0.2.0",

    # Backend API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",

    # Task queue
    "celery[redis]>=5.4.0",

    # Configuration
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",

    # HTTP client
    "httpx>=0.27.0",

    # Utilities
    "rich>=13.7.0",
    "click>=8.1.0",

    # System monitoring
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
ytauto = "cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "cli", "config.py"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
